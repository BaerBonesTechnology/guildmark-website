apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: guildmark-billing-reconcile
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: guildmark-billing-worker@guildmark-dev.iam.gserviceaccount.com
          maxRetries: 2
          timeoutSeconds: '600'
          containers:
            - image: us-central1-docker.pkg.dev/guildmark-dev/guildmark/api@sha256:b633f39db6e94918ae29290e8ea6fe4527595faedee395140b46233790d28c3f
              command: ['/app/bin/billing-reconcile']
              resources:
                limits: {cpu: '1', memory: 512Mi}
              env:
                - {name: FIREBASE_PROJECT_ID, value: guildmark-dev}
                - {name: SQUARE_ENVIRONMENT, value: sandbox}
                - {name: SQUARE_RECURRING_ENABLED, value: 'true'}
                - {name: SQUARE_LOCATION_ID, value: L95V6W1VC40PV}
                - name: SQUARE_ACCESS_TOKEN
                  valueFrom: {secretKeyRef: {name: guildmark-square-sandbox-token, key: latest}}
