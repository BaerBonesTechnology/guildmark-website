apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: guildmark-ml
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: guildmark-ml@guildmark-dev.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/guildmark-dev/guildmark/ml@sha256:9620fb83c6405b8e0a5185a5e6c09c0ab13325c8882890aab93793b9370b4b2f
          ports:
            - containerPort: 8080
          resources:
            limits: {cpu: '1', memory: 1Gi}
          env:
            - {name: ML_MODEL_DIR, value: /app/model_artifacts}
            - {name: ML_SERVING_ONLY, value: 'true'}
            - {name: ML_RETRAIN_CRON, value: 'off'}
            - name: ML_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: guildmark-ml-service-token, key: latest}}
